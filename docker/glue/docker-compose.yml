name: airflow-glue-project_1 # <--- Sets the prefix for ALL services in this file
services:
  glue-dev:
    image: amazon/aws-glue-libs:glue_libs_4.0.0_image_01
    container_name: airflow-glue-project_1_glue-dev-env
    working_dir: /home/glue_user/workspace
    ports:
      - "8888:8888" # JupyterLab UI
      - "4040:4040" # Live Spark UI (active while jobs/notebooks are running)
      - "18080:18080" # Spark History Server (Spark UI for all completed jobs)
    environment:
      - DISABLE_SSL=true
      - AWS_DEFAULT_REGION=ap-south-1 # Set to your new account's region
      - AWS_PROFILE=giduturi-tutorial-profile # Put your new profile name here
      - DATALAKE_FORMATS=delta
    volumes:
      - ../../src/jobs:/home/glue_user/workspace/jobs
      - ../../mock_data:/home/glue_user/workspace/mock_data
      - ~/.aws:/home/glue_user/.aws:ro
    networks:
      - data-network
    command:
      - -c
      - |
        pip install --no-cache-dir delta-spark==2.1.0
        sed -i 's/rootLogger.level = info/rootLogger.level = warn/g' /home/glue_user/spark/conf/log4j2.properties
        livy-server start
        jupyter lab --no-browser --ip=0.0.0.0 --allow-root --ServerApp.root_dir=/home/glue_user/workspace/ --ServerApp.token='' --ServerApp.password=''
networks:
  data-network:
    external: true
